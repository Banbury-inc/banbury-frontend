name: Build and Release

on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  e2e-tests:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: |
          cd packages/frontend
          npx playwright install
          npx playwright install-deps

      - name: Build the app
        run: npm run build

      - name: Run E2E Tests
        run: |
          cd packages/frontend
          npx playwright test --project=electron
        env:
          ELECTRON_ENABLE_LOGGING: true
          DEBUG: electron*,playwright*
          NODE_ENV: test
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-macos
          path: packages/frontend/playwright-report/
          retention-days: 30

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev')
    needs: [lint, unit-tests, e2e-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      # Linux-specific setup
      - name: Install Snapcraft
        if: runner.os == 'Linux'
        run: |
          sudo snap install snapcraft --classic
          sudo apt-get update
          sudo apt-get install -y rpm

      # macOS-specific setup
      - name: Install Python and Build Tools for macOS
        if: runner.os == 'macOS'
        run: |
          brew install python-setuptools
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip setuptools

      - name: Install the Apple certificate
        if: runner.os == 'macOS'
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Remove certificate file
          rm certificate.p12
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: keychainpassword

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      # Get version for macOS builds
      - name: Get version from package.json
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./packages/frontend/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Set app name based on branch
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "APP_NAME=Banbury-dev" >> $GITHUB_ENV
          else
            echo "APP_NAME=Banbury" >> $GITHUB_ENV
          fi

      # For macOS: Build, Sign, and Notarize in the correct order
      - name: Build and Sign macOS App
        if: runner.os == 'macOS'
        run: |
          cd packages/frontend
          # Ensure the build directory exists
          mkdir -p build
          
          # Modify package.json for dev builds
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # Create temporary package.json with dev-specific settings
            node -e "
              const pkg = require('./package.json');
              pkg.version = '${{ env.VERSION }}';  // Use the timestamped version
              pkg.build.productName = 'Banbury-dev';
              pkg.build.appId = 'com.banbury.cloud.dev';
              pkg.build.mac.artifactName = 'Banbury-dev-\${version}-\${arch}.\${ext}';
              require('fs').writeFileSync('./package.json.tmp', JSON.stringify(pkg, null, 2));
            "
            mv package.json package.json.original
            mv package.json.tmp package.json
          fi
          
          # Build the app
          npm run package:app
        env:
          CSC_KEYCHAIN: build.keychain
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          cd packages/frontend
          APP_PATH="dist/mac-arm64/${APP_NAME}.app"
          
          # Verify app exists
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH does not exist"
            exit 1
          fi
          
          # Sign with codesign explicitly
          /usr/bin/codesign --force --deep --sign "Developer ID Application: Michael Mills (${{ secrets.APPLE_TEAM_ID }})" --options runtime --entitlements "build/entitlements.mac.plist" "$APP_PATH"
          
          # Verify signing
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          
          # Export full path for the notarization script
          export APP_PATH="$(pwd)/$APP_PATH"
          
          # Now run the notarization script
          npx ts-node scripts/notarize.ts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: build.keychain

      - name: Create DMG and ZIP for macOS
        if: runner.os == 'macOS'
        run: |
          cd packages/frontend
          
          # Modify package.json for dev builds again for distribution
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            node -e "
              const pkg = require('./package.json');
              pkg.version = '${{ env.VERSION }}';  // Use the timestamped version
              pkg.build.productName = 'Banbury-dev';
              pkg.build.appId = 'com.banbury.cloud.dev';
              pkg.build.mac.artifactName = 'Banbury-dev-\${version}-\${arch}.\${ext}';
              require('fs').writeFileSync('./package.json.tmp', JSON.stringify(pkg, null, 2));
            "
            mv package.json package.json.original
            mv package.json.tmp package.json
          fi
          
          npm run package:dist
        env:
          CSC_KEYCHAIN: build.keychain
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize macOS Distribution Files
        if: runner.os == 'macOS'
        run: |
          cd packages/frontend
          
          # Notarize DMG
          DMG_PATH="dist/${APP_NAME}-${VERSION}-arm64.dmg"
          if [ -f "$DMG_PATH" ]; then
            echo "Notarizing DMG: $DMG_PATH"
            # Sign DMG explicitly
            /usr/bin/codesign --force --sign "Developer ID Application: Michael Mills (${{ secrets.APPLE_TEAM_ID }})" --options runtime "$DMG_PATH"
            # Verify signing
            /usr/bin/codesign --verify --verbose=2 "$DMG_PATH"
            # Export full path for the notarization script
            export APP_PATH="$(pwd)/$DMG_PATH"
            # Notarize
            npx ts-node scripts/notarize.ts
          else
            echo "Warning: $DMG_PATH not found"
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: build.keychain
          VERSION: ${{ env.VERSION }}

      # For non-macOS: Build and package
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          cd packages/frontend
          # Install required dependencies
          sudo snap install snapcraft --classic
          sudo apt-get update
          sudo apt-get install -y rpm
          
          # Modify package.json for dev builds on Linux
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # Get version info that was set in the macOS step
            VERSION=$(jq -r .version ../frontend/package.json)
            TIMESTAMP=$(date +%Y%m%d%H%M)
            DEV_VERSION="$VERSION-dev.$TIMESTAMP"
            
            node -e "
              const pkg = require('./package.json');
              pkg.version = '$DEV_VERSION';
              pkg.build.productName = 'Banbury-dev';
              pkg.build.appId = 'com.banbury.cloud.dev';
              pkg.build.linux.artifactName = 'Banbury-dev-\${version}.\${ext}';
              require('fs').writeFileSync('./package.json.tmp', JSON.stringify(pkg, null, 2));
            "
            mv package.json package.json.original
            mv package.json.tmp package.json
          fi
          
          # Build without publishing to Snapcraft store
          npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_PRE_RELEASE: true
          EP_DRAFT: false
          SNAP_STORE_SKIP_UPLOAD: true

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd packages/frontend
          
          # Modify package.json for dev builds on Windows
          if ("${{ github.ref }}" -eq "refs/heads/dev") {
            # Get version info 
            $VERSION = (Get-Content ./package.json | ConvertFrom-Json).version
            $TIMESTAMP = Get-Date -Format "yyyyMMddHHmm"
            $DEV_VERSION = "$VERSION-dev.$TIMESTAMP"
            
            # Use single quotes and escape properly for PowerShell
            node -e 'const pkg = require(\"./package.json\"); pkg.version = \"'$DEV_VERSION'\"; pkg.build.productName = \"Banbury-dev\"; pkg.build.appId = \"com.banbury.cloud.dev\"; pkg.build.win.artifactName = \"Banbury-dev-$${version}.$${ext}\"; require(\"fs\").writeFileSync(\"./package.json.tmp\", JSON.stringify(pkg, null, 2));'
            Move-Item package.json package.json.original
            Move-Item package.json.tmp package.json
          }
          
          npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_PRE_RELEASE: true
          EP_DRAFT: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            packages/frontend/dist/**/*
            packages/frontend/dist/**/*.yml
            packages/frontend/dist/**/*.yaml

      - name: Upload Core Package Artifact
        if: runner.os == 'Linux'
        run: |
          # Ensure core package is built
          cd packages/core
          npm install
          npm run build
          
          # Verify dist directory exists and contains files
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: Core package dist directory is empty or does not exist"
            exit 1
          fi
        
      - name: Upload Core Package Files
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: core-package
          path: packages/core/dist
          if-no-files-found: error

      # Restore original package.json at the very end for all platforms
      - name: Restore original package.json
        shell: bash
        run: |
          cd packages/frontend
          if [ -f "package.json.original" ]; then
            mv package.json.original package.json
            echo "Restored original package.json"
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Core Package
        uses: actions/download-artifact@v4
        with:
          name: core-package
          path: ./packages/core/dist
        continue-on-error: false

      - name: Verify Core Package
        run: |
          if [ ! -d "./packages/core/dist" ] || [ -z "$(ls -A ./packages/core/dist)" ]; then
            echo "Error: Core package files are missing"
            exit 1
          fi
          echo "Core package files found successfully"

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest-artifacts
          path: ./dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-latest-artifacts
          path: ./dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-latest-artifacts
          path: ./dist

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version ./packages/frontend/package.json)
          
          # Determine if this is a dev or prod release
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # For dev builds, append timestamp to ensure unique versions
            TIMESTAMP=$(date +%Y%m%d%H%M)
            DEV_VERSION="$VERSION-dev.$TIMESTAMP"
            echo "VERSION=$DEV_VERSION" >> $GITHUB_ENV
            echo "RELEASE_TYPE=dev" >> $GITHUB_ENV
            echo "TAG_NAME=v$DEV_VERSION" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "RELEASE_TYPE=prod" >> $GITHUB_ENV
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Clean up old dev releases
        if: env.RELEASE_TYPE == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Get all dev releases and delete old ones, keeping only the latest 3
          echo "Cleaning up old dev releases..."
          
          # Get all dev releases (pre-releases with "dev" in the tag), sort by version, keep latest 3
          gh release list --repo ${{ github.repository }} --limit 50 --json tagName,prerelease,createdAt | \
          jq -r '.[] | select(.prerelease == true and (.tagName | contains("dev"))) | .tagName' | \
          sort -Vr | \
          tail -n +4 | \
          while read tag; do
            if [ ! -z "$tag" ]; then
              echo "Deleting old dev release: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes || true
              git push --delete origin "$tag" 2>/dev/null || true
            fi
          done

      - name: Create and push a new tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Creating new tag ${{ env.TAG_NAME }}"
          git tag "${{ env.TAG_NAME }}"
          git push https://$GH_TOKEN@github.com/${{ github.repository }} "${{ env.TAG_NAME }}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.TAG_NAME }}"
          name: "${{ env.RELEASE_TYPE == 'dev' && format('Development Release v{0}', env.VERSION) || format('Release v{0}', env.VERSION) }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/latest*.yml
            dist/**/latest*.yaml
            dist/**/*blockmap
          body: ${{ env.RELEASE_TYPE == 'dev' && 'This is an automated development release. Use with caution as it may contain experimental features.' || 'Production release with stable features.' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Core Package
        uses: actions/download-artifact@v4
        with:
          name: core-package
          path: ./packages/core/dist

      - name: Install dependencies
        run: cd packages/core && npm install

      - name: Publish to NPM
        run: |
          cd packages/core
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}