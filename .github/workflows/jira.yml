name: Jira Sync
on:
  issues:
    types: [opened, labeled, unlabeled]
  issue_comment:
    types: [created]
  create:
    # Trigger when branches are created
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  sync:
    name: Sync Items
    runs-on: ubuntu-latest
    steps:
      - name: Sync Github Issues to Jira
        uses: jordansilva/github-action-issue-to-jira@v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          jiraHost: ${{ secrets.JIRA_HOST }}
          jiraUsername: ${{ secrets.JIRA_USERNAME }}
          jiraPassword: ${{ secrets.JIRA_PASSWORD }} # See https://id.atlassian.com/manage/api-tokens
          project: BANBURY

  branch-created:
    name: Move Jira ticket to In Progress
    runs-on: ubuntu-latest
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    steps:
      - name: Extract Jira ticket key from branch name
        id: extract_jira_key
        run: |
          branch_name="${{ github.event.ref }}"
          jira_key=$(echo "$branch_name" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          echo "jira_key=$jira_key" >> $GITHUB_OUTPUT
          echo "Found Jira key: $jira_key"
          
      - name: Jira Login
        if: steps.extract_jira_key.outputs.jira_key != ''
        uses: frieder/gha-jira-login@v1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_HOST }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_PASSWORD }}

      - name: Move ticket to In Progress
        if: steps.extract_jira_key.outputs.jira_key != ''
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ steps.extract_jira_key.outputs.jira_key }}
          transition: "In Progress"
          failOnError: false

  link-branch-to-issue:
    name: Link branch to GitHub issue
    runs-on: ubuntu-latest
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    steps:
      - name: Extract Jira ticket key from branch name
        id: extract_jira_key
        run: |
          branch_name="${{ github.event.ref }}"
          jira_key=$(echo "$branch_name" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          echo "jira_key=$jira_key" >> $GITHUB_OUTPUT
          echo "Found Jira key: $jira_key"

      - name: Find GitHub issue with Jira key
        if: steps.extract_jira_key.outputs.jira_key != ''
        id: find_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jiraKey = '${{ steps.extract_jira_key.outputs.jira_key }}';
            
            // Search for issues containing the Jira key
            const searchQuery = `repo:${{ github.repository }} is:issue "${jiraKey}" in:title,body`;
            
            try {
              const searchResults = await github.rest.search.issuesAndPullRequests({
                q: searchQuery,
                sort: 'created',
                order: 'desc'
              });
              
              console.log(`Search query: ${searchQuery}`);
              console.log(`Found ${searchResults.data.total_count} issues`);
              
              if (searchResults.data.total_count > 0) {
                const issue = searchResults.data.items[0];
                console.log(`Found issue #${issue.number}: ${issue.title}`);
                return issue.number;
              } else {
                console.log('No matching GitHub issue found');
                return null;
              }
            } catch (error) {
              console.error('Error searching for issues:', error);
              return null;
            }

      - name: Link branch to issue
        if: steps.find_issue.outputs.result != 'null' && steps.find_issue.outputs.result != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ steps.find_issue.outputs.result }};
            const branchName = '${{ github.event.ref }}';
            const branchUrl = `https://github.com/${{ github.repository }}/tree/${branchName}`;
            const jiraKey = '${{ steps.extract_jira_key.outputs.jira_key }}';
            
            const commentBody = `🔗 **Branch created for this issue**: [\`${branchName}\`](${branchUrl})
            
            📝 Jira ticket: **${jiraKey}** has been moved to **In Progress**
            
            ---
            *This comment was automatically generated when the branch was created.*`;
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
              
              console.log(`✅ Successfully linked branch "${branchName}" to issue #${issueNumber}`);
            } catch (error) {
              console.error('❌ Error creating comment:', error);
            }

  branch-merged:
    name: Move Jira ticket to Done and close GitHub issue
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Extract Jira ticket key from branch name
        id: extract_jira_key
        run: |
          branch_name="${{ github.event.pull_request.head.ref }}"
          jira_key=$(echo "$branch_name" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          echo "jira_key=$jira_key" >> $GITHUB_OUTPUT
          echo "Found Jira key: $jira_key"
          
      - name: Jira Login
        if: steps.extract_jira_key.outputs.jira_key != ''
        uses: frieder/gha-jira-login@v1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_HOST }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_PASSWORD }}

      - name: Move ticket to Done
        if: steps.extract_jira_key.outputs.jira_key != ''
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ steps.extract_jira_key.outputs.jira_key }}
          transition: "Done"
          failOnError: false

      - name: Find and close related GitHub issue
        if: steps.extract_jira_key.outputs.jira_key != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jiraKey = '${{ steps.extract_jira_key.outputs.jira_key }}';
            const prNumber = ${{ github.event.pull_request.number }};
            const prUrl = '${{ github.event.pull_request.html_url }}';
            const branchName = '${{ github.event.pull_request.head.ref }}';
            
            // Search for GitHub issues containing the Jira key
            const searchQuery = `repo:${{ github.repository }} is:issue is:open "${jiraKey}" in:title,body`;
            
            try {
              console.log(`🔍 Searching for open GitHub issues with Jira key: ${jiraKey}`);
              
              const searchResults = await github.rest.search.issuesAndPullRequests({
                q: searchQuery,
                sort: 'created',
                order: 'desc'
              });
              
              console.log(`Found ${searchResults.data.total_count} open issues matching "${jiraKey}"`);
              
              if (searchResults.data.total_count > 0) {
                const issue = searchResults.data.items[0];
                console.log(`📋 Found issue #${issue.number}: ${issue.title}`);
                
                // Add closing comment
                const commentBody = `🎉 **Issue completed and closed!**
                
                ✅ **Pull Request merged**: [#${prNumber}](${prUrl})  
                🔀 **Branch**: \`${branchName}\`  
                📝 **Jira ticket**: **${jiraKey}** has been moved to **Done**
                
                This issue has been automatically closed because the related pull request was merged to the \`dev\` branch.
                
                ---
                *This comment was automatically generated when the pull request was merged.*`;
                
                // Add comment to issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: commentBody
                });
                
                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                
                console.log(`✅ Successfully closed GitHub issue #${issue.number}`);
                console.log(`📝 Added closing comment with PR reference`);
                
              } else {
                console.log(`ℹ️  No open GitHub issue found for Jira key: ${jiraKey}`);
              }
              
            } catch (error) {
              console.error('❌ Error finding or closing GitHub issue:', error);
              // Don't fail the workflow if GitHub issue operations fail
            }
